<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRU - Cardápio & Avaliações do RU | Critic RU UFPI</title>
  <meta name="description" content="Veja o cardápio completo do RU e leia/envie avaliações dos pratos no Critic RU UFPI.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="app" class="app-container">

    <main class="main-content" style="padding-top: 16px;">

      <!-- Voltar -->
      <a id="btn-back-header" href="index.html" class="btn-back-home" style="color: var(--primary); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700; margin-bottom: 16px;">
        <i data-lucide="arrow-left"></i>
        <span id="btn-back-text">Voltar ao Cardápio Geral</span>
      </a>

      <!-- Cabeçalho do RU -->
      <section class="ru-detail-header-card">
        <div class="ru-detail-info">
          <h1 id="ru-detail-title" class="ru-detail-title">RU 1 - CCN</h1>
          <div class="ru-rating-inline">
            <i data-lucide="star" class="ru-star-icon"></i>
            <span id="ru-detail-score" class="ru-rating-val">4.8</span>
            <span id="ru-detail-count" class="ru-rating-cnt">(142 avaliações)</span>
          </div>
        </div>
        <span class="ru-status-pill">
          <i data-lucide="check-circle-2"></i>
          <span>Aberto Hoje</span>
        </span>
      </section>

      <!-- Cardápio Completo do RU -->
      <section class="ru-full-menu-section">
        <div class="section-header" style="margin-bottom: 14px;">
          <h2 class="section-title" style="display: flex; align-items: center; gap: 8px;">
            <i data-lucide="utensils" style="color: var(--primary);"></i>
            <span>Cardápio Completo do Dia</span>
          </h2>
          <span id="ru-meal-label" style="font-size: 11px; font-weight: 700; background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: var(--radius-full);">Almoço</span>
        </div>

        <div id="ru-menu-items-list" class="ru-menu-items-list">
          <!-- Renderizado dinamicamente pelo JS -->
        </div>
      </section>

      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 24px 0;">

      <!-- Seção de Comentários e Avaliações (Estilo YouTube / E-Commerce) -->
      <section id="comments-section" class="comments-section">
        
        <div class="comments-header">
          <h3 class="comments-count-title">
            <span id="comments-count">77</span> Avaliações e Comentários
          </h3>
          <button class="btn-sort-comments" id="btn-sort-comments">
            <i data-lucide="sliders-horizontal"></i>
            <span>Ordenar por</span>
          </button>
        </div>

        <!-- Formulário "Faça a sua avaliação" (Estilo YouTube) -->
        <div class="add-review-box">
          <div class="add-review-user-row">
            <div class="user-avatar-yt">H</div>
            <div class="add-review-inputs">
              
              <!-- Seletor de Estrelas -->
              <div class="yt-star-picker">
                <span class="yt-picker-label">Sua nota:</span>
                <div id="yt-star-group" class="yt-star-group">
                  <button type="button" class="yt-star-btn" data-value="1" aria-label="1 estrela"><i data-lucide="star"></i></button>
                  <button type="button" class="yt-star-btn" data-value="2" aria-label="2 estrelas"><i data-lucide="star"></i></button>
                  <button type="button" class="yt-star-btn" data-value="3" aria-label="3 estrelas"><i data-lucide="star"></i></button>
                  <button type="button" class="yt-star-btn" data-value="4" aria-label="4 estrelas"><i data-lucide="star"></i></button>
                  <button type="button" class="yt-star-btn" data-value="5" aria-label="5 estrelas"><i data-lucide="star"></i></button>
                </div>
                <span id="yt-star-text" class="yt-rating-text">Selecione as estrelas</span>
              </div>

              <!-- Tags Rápidas -->
              <div class="yt-quick-tags">
                <button type="button" class="yt-tag-chip">😋 Saboroso</button>
                <button type="button" class="yt-tag-chip">🔥 Quentinho</button>
                <button type="button" class="yt-tag-chip">🧂 Pouco Sal</button>
                <button type="button" class="yt-tag-chip">⏳ Fila Demorada</button>
                <button type="button" class="yt-tag-chip">⚡ Atendimento Rápido</button>
              </div>

              <!-- Input de Texto do Comentário -->
              <div class="yt-comment-input-wrapper">
                <textarea id="yt-comment-text" rows="2" placeholder="Adicione um comentário sobre a refeição de hoje..."></textarea>
              </div>

              <!-- Ações (Cancelar e Publicar) -->
              <div class="add-review-actions">
                <button type="button" id="btn-cancel-yt-comment" class="btn-yt-cancel">Cancelar</button>
                <button type="button" id="btn-submit-yt-comment" class="btn-yt-submit">Publicar Avaliação</button>
              </div>

            </div>
          </div>
        </div>

        <!-- Feed de Comentários / Avaliações de Alunos -->
        <div id="comments-feed" class="comments-feed">
          <!-- Renderizado dinamicamente via JS -->
        </div>

      </section>

    </main>

    <!-- Navegação Principal -->
    <nav class="bottom-nav" aria-label="Navegação Principal">
      <a href="index.html" class="nav-item">
        <i data-lucide="utensils"></i>
        <span>Cardápio</span>
      </a>
      <a href="minhas-avaliacoes.html" class="nav-item">
        <i data-lucide="star"></i>
        <span>Avaliações</span>
      </a>
      <a href="perfil.html" class="nav-item">
        <i data-lucide="user"></i>
        <span>Perfil</span>
      </a>
    </nav>

  </div>

  <script src="js/data.js"></script>
  <script src="js/detalhes-ru.js"></script>
</body>

</html>
